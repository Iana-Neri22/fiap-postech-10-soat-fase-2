basePath: /
definitions:
  entities.AcompanhamentoPedido:
    properties:
      id:
        type: string
      pedidos:
        $ref: '#/definitions/entities.FilaPedidos'
      tempoEstimado:
        $ref: '#/definitions/time.Duration'
      ultimaAtualizacao:
        type: string
    type: object
  entities.CatProduto:
    enum:
    - Lanche
    - Acompanhamento
    - Bebida
    type: string
    x-enum-varnames:
    - Lanche
    - Acompanhamento
    - Bebida
  entities.Cliente:
    properties:
      cpf:
        type: string
      email:
        type: string
      nome:
        type: string
    type: object
  entities.FilaPedidos:
    type: object
  entities.Pagamento:
    properties:
      dataCriacao:
        type: string
      idPagamento:
        type: string
      status:
        type: string
      valor:
        type: string
    type: object
  entities.Pedido:
    properties:
      cpf:
        type: string
      identificacao:
        type: string
      produtos:
        items:
          $ref: '#/definitions/entities.Produto'
        type: array
      status:
        $ref: '#/definitions/entities.StatusPedido'
      timeStamp:
        format: date-time
        type: string
      total:
        type: number
      ultimaAtualizacao:
        format: date-time
        type: string
    type: object
  entities.Produto:
    properties:
      categoria:
        $ref: '#/definitions/entities.CatProduto'
      identificacao:
        type: string
      nome:
        type: string
      preco:
        type: number
    type: object
  entities.StatusPedido:
    enum:
    - Pendente
    - Recebido
    - Em preparação
    - Pronto
    - Finalizado
    type: string
    x-enum-varnames:
    - Pendente
    - Recebido
    - EmPreparacao
    - Pronto
    - Finalizado
  presenters.AcompanhamentoDTO:
    properties:
      pedidos:
        items:
          $ref: '#/definitions/presenters.PedidoDTO'
        type: array
    type: object
  presenters.PedidoDTO:
    properties:
      id:
        type: string
      identificacao:
        type: string
      status:
        $ref: '#/definitions/entities.StatusPedido'
      tempoEstimado:
        $ref: '#/definitions/time.Duration'
    type: object
  response.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  response.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  time.Duration:
    enum:
    - 900
    type: integer
    x-enum-varnames:
    - minDuration
    - maxDuration
    - Nanosecond
    - Microsecond
    - Millisecond
    - Second
    - Minute
    - Hour
host: localhost:8080
info:
  contact: {}
  description: API para o Tech Challenge 2 da FIAP - SOAT
  title: Lanchonete API - Tech Challenge 2
  version: "1.0"
paths:
  /acompanhamento:
    post:
      consumes:
      - application/json
      description: Cria um acompanhamento
      parameters:
      - description: Acompanhamento
        in: body
        name: acompanhamento
        required: true
        schema:
          $ref: '#/definitions/entities.AcompanhamentoPedido'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Cria um acompanhamento
      tags:
      - acompanhamento
  /acompanhamento/{ID}:
    get:
      consumes:
      - application/json
      description: Busca um pedido
      parameters:
      - description: ID do pedido
        in: path
        name: ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entities.AcompanhamentoPedido'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Busca um pedido
      tags:
      - acompanhamento
  /acompanhamento/{ID}/status:
    put:
      consumes:
      - application/json
      description: Atualiza o status de um pedido
      parameters:
      - description: ID do pedido
        in: path
        name: ID
        required: true
        type: string
      - description: Novo status
        in: body
        name: status
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Atualiza o status de um pedido
      tags:
      - acompanhamento
  /acompanhamento/{IDAcompanhamento}/{IDPedido}:
    post:
      consumes:
      - application/json
      description: Adiciona um pedido existente ao acompanhamento de pedidos
      parameters:
      - description: ID do acompanhamento
        in: path
        name: IDAcompanhamento
        required: true
        type: string
      - description: ID do pedido
        in: path
        name: IDPedido
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Pedido ou acompanhamento não encontrado
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Erro interno
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Adiciona um pedido ao acompanhamento
      tags:
      - acompanhamento
  /acompanhamento/show:
    get:
      consumes:
      - application/json
      description: Busca um acompanhamento
      parameters:
      - description: Número do pedido
        in: path
        name: ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/presenters.AcompanhamentoDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Busca um acompanhamento
      tags:
      - acompanhamento
  /cliente:
    post:
      consumes:
      - application/json
      description: Cria um cliente
      parameters:
      - description: Cliente
        in: body
        name: cliente
        required: true
        schema:
          $ref: '#/definitions/entities.Cliente'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Cria um cliente
      tags:
      - cliente
  /cliente/{CPF}:
    get:
      consumes:
      - application/json
      description: Busca um cliente
      parameters:
      - description: CPF do cliente
        in: path
        name: CPF
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entities.Cliente'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Busca um cliente
      tags:
      - cliente
  /pagamento:
    post:
      consumes:
      - application/json
      description: Envia o pagamento para o webhook
      parameters:
      - description: Pagamento
        in: body
        name: pagamento
        required: true
        schema:
          $ref: '#/definitions/entities.Pagamento'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Envia o pagamento para o webhook
      tags:
      - pagamento
  /pagamento/confirmar:
    post:
      consumes:
      - application/json
      description: Confirma o pagamento
      parameters:
      - description: Pagamento
        in: body
        name: pagamento
        required: true
        schema:
          $ref: '#/definitions/entities.Pagamento'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Confirma o pagamento
      tags:
      - pagamento
  /pedidos:
    post:
      consumes:
      - application/json
      description: Cria um pedido
      parameters:
      - description: Pedido
        in: body
        name: pedido
        required: true
        schema:
          $ref: '#/definitions/entities.Pedido'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Cria um pedido
      tags:
      - pedido
  /pedidos/{ID}:
    get:
      consumes:
      - application/json
      description: Busca um pedido
      parameters:
      - description: Número do pedido
        in: path
        name: ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entities.Pedido'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Busca um pedido
      tags:
      - pedido
swagger: "2.0"
